# Infrastructure as Code pipeline.
# - PRs touching infra/** : fmt + validate + plan (plan posted to the job summary)
# - Manual run (Actions > Infrastructure > Run workflow): plan | apply | destroy, gated by the
#   "infrastructure" environment (add yourself as a required reviewer for an approval step).
name: Infrastructure

on:
  pull_request:
    paths: ["infra/**"]
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    if: vars.AWS_TERRAFORM_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    environment: infrastructure
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_owner: ${{ github.repository_owner }}
      TF_VAR_create_github_oidc_provider: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init (remote S3 state with locking)
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=propertyhub/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - name: Plan
        if: github.event_name == 'pull_request' || inputs.action == 'plan' || inputs.action == 'apply'
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan | tail -60 > plan.txt
          { echo '### Terraform plan'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -input=false tfplan
      - name: Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve
