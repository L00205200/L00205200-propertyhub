{{- if .Values.networkPolicy.enabled }}
# Only the ingress controller and Prometheus may reach the app; all other ingress is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: propertyhub
  labels:
    {{- include "propertyhub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "propertyhub.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- toYaml .Values.networkPolicy.allowedNamespaces | nindent 18 }}
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
