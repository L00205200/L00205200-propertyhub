# Local Alertmanager. Alerts are visible at http://localhost:9093.
# To get notifications, uncomment a receiver below (keep real webhook URLs out of git, e.g. use env-substituted files).
route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 1h

receivers:
  - name: default
