# Jenkins Configuration as Code. ${VARS} come from the container environment (jenkins/.env).
jenkins:
  systemMessage: "L00205200-propertyhub CI/CD - configured as code (jenkins/casc/jenkins.yaml)"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Administrator"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          - key: DOCKERHUB_REPO
            value: "${DOCKERHUB_REPO}"
          - key: REPO_URL
            value: "${REPO_URL}"
          - key: AWS_REGION
            value: "${AWS_REGION:-eu-west-1}"
          - key: EC2_INSTANCE_ID
            value: "${EC2_INSTANCE_ID:-}"
          - key: APP_URL
            value: "${APP_URL:-}"

security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8080/}"
  sonarGlobalConfiguration:
    buildWrapperEnabled: false
    installations:
      - name: "sonarqube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"

# The pipeline job: builds every branch that has a Jenkinsfile.
jobs:
  - script: >
      multibranchPipelineJob('L00205200-propertyhub') {
        displayName('L00205200-propertyhub')
        description('CI/CD pipeline defined in the repository Jenkinsfile')
        branchSources {
          branchSource {
            source {
              git {
                id('propertyhub-git')
                remote('${REPO_URL}')
                traits {
                  gitBranchDiscovery()
                }
              }
            }
          }
        }
        orphanedItemStrategy {
          discardOldItems { numToKeep(10) }
        }
        triggers {
          periodicFolderTrigger { interval('2m') }
        }
      }
