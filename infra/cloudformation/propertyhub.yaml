AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PropertyHub Ireland - VPC, hardened EC2 node running k3s (Kubernetes) with Prometheus, Grafana,
  Alertmanager and Loki, Grafana secret in Secrets Manager, and optional GitHub OIDC deploy role.
  Works in a personal AWS account (CreateIamRoles=true) or AWS Academy Learner Lab (CreateIamRoles=false).

# ---------------------------------------------------------------------------------------------
# Console layout (groups the parameters on the "Create stack" page)
# ---------------------------------------------------------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "General" }
        Parameters: [ProjectName, Owner]
      - Label: { default: "IAM and GitHub (set CreateIamRoles=false in Learner Lab)" }
        Parameters: [CreateIamRoles, ExistingInstanceProfile, GitHubRepository, CreateGitHubOidcProvider]
      - Label: { default: "Compute" }
        Parameters: [InstanceType, RootVolumeSize, LatestAmiId, K3sChannel, KubePrometheusStackVersion]
      - Label: { default: "Network" }
        Parameters: [VpcCidr, PublicSubnetCidr, AllowedHttpCidr]
    ParameterLabels:
      CreateIamRoles: { default: "Create IAM roles? (false for Learner Lab)" }
      ExistingInstanceProfile: { default: "Existing instance profile (used when not creating roles)" }
      GitHubRepository: { default: "GitHub repo owner/name (blank = no GitHub deploy role)" }

# ---------------------------------------------------------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: propertyhub
    AllowedPattern: "^[a-z][a-z0-9-]{2,20}$"
    Description: Lower-case prefix for resource names

  Owner:
    Type: String
    Default: L00205200
    Description: Owner tag (student number)

  CreateIamRoles:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      true = create the node role and GitHub OIDC deploy role (personal account).
      false = use ExistingInstanceProfile (AWS Academy Learner Lab does not allow creating IAM roles).

  ExistingInstanceProfile:
    Type: String
    Default: LabInstanceProfile
    Description: Instance profile to attach when CreateIamRoles=false

  GitHubRepository:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    Description: "owner/repo allowed to deploy via OIDC, case-sensitive (e.g. L00205200/L00205200-propertyhub)"

  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set false if the account already has the token.actions.githubusercontent.com provider

  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.medium, t3.large, t3.xlarge, m5.large]
    Description: t3.large (8 GB) comfortably runs k3s + app + monitoring stack

  RootVolumeSize:
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 100

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Ubuntu 24.04 LTS (resolved from Canonical's public SSM parameter)

  K3sChannel:
    Type: String
    Default: stable
    AllowedValues: [stable, latest]

  KubePrometheusStackVersion:
    Type: String
    Default: ""
    Description: kube-prometheus-stack Helm chart version (blank = latest; pin for reproducibility)

  VpcCidr:
    Type: String
    Default: 10.30.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  PublicSubnetCidr:
    Type: String
    Default: 10.30.1.0/24
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  AllowedHttpCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: Who can reach the app and Grafana on port 80 (use your-ip/32 to restrict)

# ---------------------------------------------------------------------------------------------
Conditions:
  CreateRoles: !Equals [!Ref CreateIamRoles, "true"]
  HasGitHubRepo: !Not [!Equals [!Ref GitHubRepository, ""]]
  CreateGitHubRoles: !And [!Condition CreateRoles, !Condition HasGitHubRepo]
  CreateOidcProvider: !And [!Condition CreateGitHubRoles, !Equals [!Ref CreateGitHubOidcProvider, "true"]]
  PinKps: !Not [!Equals [!Ref KubePrometheusStackVersion, ""]]

# ---------------------------------------------------------------------------------------------
Resources:
  # ============================== NETWORK ==============================
  Vpc:
    Type: AWS::EC2::VPC
    Metadata:
      checkov:
        skip:
          - id: CKV2_AWS_11
            comment: Flow logs omitted to keep the lab cost-free; enable for production
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-vpc" }
        - { Key: Owner, Value: !Ref Owner }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-igw" }

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-public" }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-public-rt" }

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # HTTP only - there is NO SSH rule. Shell access is via SSM Session Manager.
  NodeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_260
            comment: Public web app - port 80 must be reachable; restrict with AllowedHttpCidr
    Properties:
      GroupDescription: PropertyHub k3s node - HTTP in, all egress
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: HTTP to Traefik ingress (app and Grafana)
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedHttpCidr
      SecurityGroupEgress:
        - Description: Outbound for packages, container images and AWS APIs
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-node-sg" }

  # ============================== SECRETS ==============================
  # Generated by AWS - the password never appears in the template, git, or the pipeline.
  GrafanaAdminSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_149
            comment: AWS-managed key is sufficient for a lab; use a customer-managed KMS key in production
    Properties:
      Name: !Sub "${ProjectName}/grafana-admin-password"
      Description: Grafana admin password, read by the node at boot
      GenerateSecretString:
        PasswordLength: 24
        ExcludePunctuation: true

  # ============================== IAM (personal account only) ==============================
  NodeRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      RoleName: !Sub "${ProjectName}-node"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: read-grafana-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GrafanaAdminSecret

  NodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: CreateRoles
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-node"
      Roles: [!Ref NodeRole]

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # GitHub Actions assumes this with a short-lived OIDC token (no AWS keys stored in GitHub).
  # Only jobs in this repo's "production" environment can assume it, and it can only run SSM on the node.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Condition: CreateGitHubRoles
    Properties:
      RoleName: !Sub "${ProjectName}-github-deploy"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !GetAtt GitHubOidcProvider.Arn
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepository}:environment:production"
      Policies:
        - PolicyName: ssm-deploy-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunDeployScriptOnNode
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Node}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Sid: ReadCommandResults
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ec2:DescribeInstances
                Resource: "*"

  # ============================== COMPUTE ==============================
  # The stack waits (up to 30 min) until the node reports that k3s + monitoring are installed.
  BootstrapWaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  BootstrapWaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: Node
    Properties:
      Handle: !Ref BootstrapWaitHandle
      Timeout: "1800"
      Count: 1

  Node:
    Type: AWS::EC2::Instance
    DependsOn: PublicRoute
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_126
            comment: Detailed CloudWatch monitoring costs extra; Prometheus provides metrics
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref NodeSecurityGroup]
      IamInstanceProfile: !If [CreateRoles, !Ref NodeInstanceProfile, !Ref ExistingInstanceProfile]
      EbsOptimized: true
      Monitoring: false
      MetadataOptions:
        HttpTokens: required            # IMDSv2 only
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-k3s" }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Project, Value: propertyhub }
      # In !Sub, ${Name} is a CloudFormation value; ${!NAME} would be a literal bash ${NAME}.
      # Bash variables below are written as $NAME (no braces) so they pass through untouched.
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euxo pipefail
            exec > >(tee -a /var/log/propertyhub-bootstrap.log) 2>&1
            WAIT_URL='${BootstrapWaitHandle}'
            signal() {
              printf '{"Status":"%s","Reason":"%s","UniqueId":"bootstrap","Data":"%s"}' "$1" "$2" "$2" > /tmp/signal.json
              curl -sS -X PUT -H 'Content-Type:' --data-binary @/tmp/signal.json "$WAIT_URL" || true
            }
            trap 'signal FAILURE "Bootstrap failed - see /var/log/propertyhub-bootstrap.log"' ERR

            # The Elastic IP is attached just after boot: wait until the node can reach the internet
            for _ in $(seq 1 60); do curl -s --max-time 5 -o /dev/null https://get.k3s.io && break; sleep 5; done

            export DEBIAN_FRONTEND=noninteractive
            export HOME=/root
            apt-get update -y
            apt-get install -y curl git jq unzip ca-certificates
            command -v aws >/dev/null 2>&1 || snap install aws-cli --classic

            # ---- k3s: lightweight Kubernetes (includes Traefik ingress + metrics-server) ----
            curl -sfL https://get.k3s.io | INSTALL_K3S_CHANNEL='${K3sChannel}' sh -s - \
              --write-kubeconfig-mode 600 --secrets-encryption
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            echo 'export KUBECONFIG=/etc/rancher/k3s/k3s.yaml' > /etc/profile.d/k3s.sh
            until kubectl get nodes 2>/dev/null | grep -q " Ready"; do sleep 5; done

            # ---- Helm ----
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
            helm repo add grafana https://grafana.github.io/helm-charts
            helm repo update

            # ---- Grafana admin secret: Secrets Manager -> Kubernetes Secret ----
            GRAFANA_PW=$(aws secretsmanager get-secret-value --region '${AWS::Region}' \
              --secret-id '${GrafanaAdminSecret}' --query SecretString --output text)
            kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n monitoring create secret generic grafana-admin \
              --from-literal=admin-user=admin --from-literal=admin-password="$GRAFANA_PW" \
              --dry-run=client -o yaml | kubectl apply -f -
            unset GRAFANA_PW

            # ---- kube-prometheus-stack: Prometheus, Alertmanager, Grafana ----
            cat > /opt/kps-values.yaml <<'EOF'
            grafana:
              admin:
                existingSecret: grafana-admin
                userKey: admin-user
                passwordKey: admin-password
              grafana.ini:
                server:
                  root_url: "%(protocol)s://%(domain)s/grafana/"
                  serve_from_sub_path: true
              ingress:
                enabled: true
                ingressClassName: traefik
                path: /grafana
                hosts: []
              additionalDataSources:
                - name: Loki
                  uid: loki
                  type: loki
                  access: proxy
                  url: http://loki.monitoring:3100
              sidecar:
                dashboards:
                  enabled: true
                  label: grafana_dashboard
                  searchNamespace: ALL
            prometheus:
              prometheusSpec:
                retention: 7d
                serviceMonitorSelectorNilUsesHelmValues: false
                podMonitorSelectorNilUsesHelmValues: false
                ruleSelectorNilUsesHelmValues: false
            kubeEtcd:
              enabled: false
            kubeControllerManager:
              enabled: false
            kubeScheduler:
              enabled: false
            kubeProxy:
              enabled: false
            EOF
            helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
              -n monitoring ${KpsVersionFlag} -f /opt/kps-values.yaml --wait --timeout 20m

            # ---- Loki + Promtail: log aggregation ----
            helm upgrade --install loki grafana/loki-stack -n monitoring --version 2.10.2 \
              --set grafana.enabled=false --set prometheus.enabled=false \
              --set promtail.enabled=true --set loki.persistence.enabled=false \
              --wait --timeout 10m

            kubectl create namespace propertyhub --dry-run=client -o yaml | kubectl apply -f -
            touch /opt/propertyhub-bootstrap-complete
            signal SUCCESS "k3s and monitoring stack ready"
          - KpsVersionFlag: !If [PinKps, !Sub "--version ${KubePrometheusStackVersion}", ""]

  NodeEip:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref Node
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-eip" }

# ---------------------------------------------------------------------------------------------
Outputs:
  AwsRegion:
    Description: GitHub variable AWS_REGION
    Value: !Ref AWS::Region
  InstanceId:
    Description: GitHub variable EC2_INSTANCE_ID
    Value: !Ref Node
  PublicIp:
    Value: !Ref NodeEip
  AppUrl:
    Description: GitHub variable APP_URL
    Value: !Sub "http://${NodeEip}"
  GrafanaUrl:
    Description: GitHub variable GRAFANA_URL (user admin)
    Value: !Sub "http://${NodeEip}/grafana"
  DeployRoleArn:
    Condition: CreateGitHubRoles
    Description: GitHub variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  GrafanaPasswordCommand:
    Description: Run this to read the Grafana admin password
    Value: !Sub "aws secretsmanager get-secret-value --secret-id ${GrafanaAdminSecret} --query SecretString --output text --region ${AWS::Region}"
  SessionManagerCommand:
    Description: Shell on the node without SSH
    Value: !Sub "aws ssm start-session --target ${Node} --region ${AWS::Region}"
