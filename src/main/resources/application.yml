spring:
  application:
    name: propertyhub
  thymeleaf:
    cache: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s

info:
  app:
    name: PropertyHub Ireland - L00205200
    university: ${propertyhub.project.university}
    assignment: ${propertyhub.project.assignment}
    student-number: ${propertyhub.project.student-number}
    version: ${APP_VERSION:local}
    commit: ${GIT_COMMIT:local}

propertyhub:
  # Assignment details shown on every page and on /about. Change them here only.
  project:
    university: Atlantic Technological University (ATU)
    course: Postgraduate DevOps
    assignment: Task 3 - CI/CD Pipeline
    student-name: Raju Augustine
    student-number: L00205200
  chaos:
    enabled: ${CHAOS_ENABLED:false}

logging:
  level:
    root: INFO
    ie.propertyhub: INFO
